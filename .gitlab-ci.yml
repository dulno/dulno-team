stages:
  - test
  - build
  - assemble
  - scan
  - publish
  - deploy
  - validate
  - merge

variables:
  DOCKER_IMAGE: "dulno-team"
  DOCKER_DOCS_IMAGE: "dulno-team-docs"
  KUBERNETES_RESOURCE: "deployment/dulno-team-deployment"
  KUBERNETES_APP:  "dulno-team"

include:
  - project: 'dulno/dulno-template'
    file: '/scan/scan-template.yml'
  - project: 'dulno/dulno-template'
    file: '/merge/merge-template.yml'

test:
  stage: test
  image: gradle:9.0.0-jdk21
  script:
    - gradle test

build_jar:
  stage: build
  image: gradle:9.0.0-jdk21
  script:
    - gradle bootJar
  artifacts:
    paths:
      - build/libs/
    expire_in: 1 day

build_geo:
  stage: build
  image: gradle:9.0.0-jdk21
  script:
    - gradle downloadGeoLite2Database
  artifacts:
    paths:
      - geo/
    expire_in: 1 day

build_docs:
  stage: build
  image: gradle:9.0.0-jdk21
  script:
    - gradle javadoc
  artifacts:
    paths:
      - build/docs/javadoc/
    expire_in: 1 day

assemble_team_staging:
  stage: assemble
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  dependencies:
    - build_jar
    - build_geo
  before_script:
    - echo "{\"auths\":{\"$STAGING_DOCKER_REGISTRY\":{\"username\":\"$STAGING_DOCKER_USERNAME\",\"password\":\"$STAGING_DOCKER_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:test"
  only:
    - dev

assemble_team_production:
  stage: assemble
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  dependencies:
    - build_jar
    - build_geo
  before_script:
    - echo "{\"auths\":{\"$PRODUCTION_DOCKER_REGISTRY\":{\"username\":\"$PRODUCTION_DOCKER_USERNAME\",\"password\":\"$PRODUCTION_DOCKER_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --destination "$PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:test"
  only:
    - main

assemble_docs:
  stage: assemble
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  dependencies:
    - build_docs
  before_script:
    - echo "{\"auths\":{\"$STAGING_DOCKER_REGISTRY\":{\"username\":\"$STAGING_DOCKER_USERNAME\",\"password\":\"$STAGING_DOCKER_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/docs/Dockerfile" \
        --destination "$STAGING_DOCKER_REGISTRY/$DOCKER_DOCS_IMAGE:test" \
  only:
    - dev

scan_container_staging:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  dependencies: []
  variables:
    TRIVY_USERNAME: $STAGING_DOCKER_USERNAME
    TRIVY_PASSWORD: $STAGING_DOCKER_PASSWORD
  script:
    - trivy image --download-db-only --no-progress --cache-dir .trivycache/
    - trivy image "$STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:test" --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/
  cache:
    key: trivy-cache
    paths:
      - .trivycache/
  allow_failure: false
  only:
    - dev

scan_container_production:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  dependencies: []
  variables:
    TRIVY_USERNAME: $PRODUCTION_DOCKER_USERNAME
    TRIVY_PASSWORD: $PRODUCTION_DOCKER_PASSWORD
  script:
    - trivy image --download-db-only --no-progress --cache-dir .trivycache/
    - trivy image "$PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:test" --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/
  cache:
    key: trivy-cache
    paths:
      - .trivycache/
  allow_failure: false
  only:
    - main

publish_team_staging:
  stage: publish
  image:
    name: quay.io/skopeo/stable:latest
    entrypoint: [""]
  dependencies: []
  before_script:
    - skopeo login --username "$STAGING_DOCKER_USERNAME" --password "$STAGING_DOCKER_PASSWORD" $STAGING_DOCKER_REGISTRY
  script:
    - |
      skopeo copy \
        docker://${STAGING_DOCKER_REGISTRY}/${DOCKER_IMAGE}:test \
        docker://${STAGING_DOCKER_REGISTRY}/${DOCKER_IMAGE}:latest
  only:
    - dev

publish_team_production:
  stage: publish
  image:
    name: quay.io/skopeo/stable:latest
    entrypoint: [""]
  dependencies: []
  before_script:
    - skopeo login --username "$PRODUCTION_DOCKER_USERNAME" --password "$PRODUCTION_DOCKER_PASSWORD" $PRODUCTION_DOCKER_REGISTRY
  script:
    - |
      skopeo copy \
        docker://${PRODUCTION_DOCKER_REGISTRY}/${DOCKER_IMAGE}:test \
        docker://${PRODUCTION_DOCKER_REGISTRY}/${DOCKER_IMAGE}:latest
  only:
    - main

publish_docs:
  stage: publish
  image:
    name: quay.io/skopeo/stable:latest
    entrypoint: [""]
  dependencies: []
  before_script:
    - skopeo login --username "$STAGING_DOCKER_USERNAME" --password "$STAGING_DOCKER_PASSWORD" $STAGING_DOCKER_REGISTRY
  script:
    - |
      skopeo copy \
        docker://${STAGING_DOCKER_REGISTRY}/${DOCKER_DOCS_IMAGE}:test \
        docker://${STAGING_DOCKER_REGISTRY}/${DOCKER_DOCS_IMAGE}:latest
  only:
    - dev

deploy_team_staging:
  stage: deploy
  image:
    name: bitnamilegacy/kubectl:latest
    entrypoint: [""]
  dependencies: []
  before_script:
    - mkdir -p ~/.kube
    - echo "$STAGING_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_RESOURCE
    - kubectl rollout status $KUBERNETES_RESOURCE
  only:
    - dev

deploy_team_production:
  stage: deploy
  image:
    name: bitnamilegacy/kubectl:latest
    entrypoint: [""]
  dependencies: []
  before_script:
    - mkdir -p ~/.kube
    - echo "$PRODUCTION_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_RESOURCE
    - kubectl rollout status $KUBERNETES_RESOURCE
  only:
    - main

deploy_wiki:
  stage: deploy
  trigger:
    project: $WIKI_PIPELINE_PROJECT
    branch: main
  only:
    - dev

validate_staging:
  stage: validate
  image:
    name: bitnamilegacy/kubectl:latest
    entrypoint: [ "" ]
  dependencies: []
  before_script:
    - mkdir -p ~/.kube
    - echo "$STAGING_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - |
      NEW_POD=$(kubectl get pods -l app=${KUBERNETES_APP} -o jsonpath='{.items[0].metadata.name}')
      kubectl logs $NEW_POD
  only:
    - dev
  when: manual

validate_production:
  stage: validate
  image:
    name: bitnamilegacy/kubectl:latest
    entrypoint: [ "" ]
  dependencies: []
  before_script:
    - mkdir -p ~/.kube
    - echo "$PRODUCTION_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - |
      NEW_POD=$(kubectl get pods -l app=${KUBERNETES_APP} -o jsonpath='{.items[0].metadata.name}')
      kubectl logs $NEW_POD
  only:
    - main
  when: manual