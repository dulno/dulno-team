stages:
  - build
  - assemble
  - scan
  - publish
  - deploy
  - validate
  - merge

variables:
  DOCKER_IMAGE: "dulno-team"
  DOCKER_DOCS_IMAGE: "dulno-team-docs"
  KUBERNETES_RESOURCE: "deployment/dulno-team-deployment"
  KUBERNETES_APP:  "dulno-team"

build:
  stage: build
  image: gradle:8.13.0-jdk21
  script:
    - gradle bootJar
    - gradle javadoc
    - gradle downloadGeoLite2Database
  artifacts:
    paths:
      - build/libs/
      - build/docs/javadoc/
      - geo/
    expire_in: 1 day

assemble_staging:
  stage: assemble
  image: docker:cli
  services:
    - docker:dind
  dependencies:
    - build
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $STAGING_DOCKER_PASSWORD | docker login -u $STAGING_DOCKER_USERNAME --password-stdin $STAGING_DOCKER_REGISTRY
    - docker build -t $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:test .
    - docker push $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:test
  only:
    - dev

assemble_production:
  stage: assemble
  image: docker:cli
  services:
    - docker:dind
  dependencies:
    - build
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - echo $PRODUCTION_DOCKER_PASSWORD | docker login -u $PRODUCTION_DOCKER_USERNAME --password-stdin $PRODUCTION_DOCKER_REGISTRY
    - docker build -t $PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:test .
    - docker push $PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:test
  only:
    - main

scan_staging:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  dependencies:
    - assemble_staging
  variables:
    GIT_STRATEGY: none
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    TRIVY_USERNAME: $STAGING_DOCKER_USERNAME
    TRIVY_PASSWORD: $STAGING_DOCKER_PASSWORD
  script:
    - trivy --version
    - time trivy clean --scan-cache
    - time trivy image --download-db-only --no-progress --cache-dir .trivycache/
    - trivy image --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/ $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:test
  cache:
    paths:
      - .trivycache/
  only:
    - dev

scan_production:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  dependencies:
    - assemble_production
  variables:
    GIT_STRATEGY: none
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    TRIVY_USERNAME: $PRODUCTION_DOCKER_USERNAME
    TRIVY_PASSWORD: $PRODUCTION_DOCKER_PASSWORD
  script:
    - trivy --version
    - time trivy clean --scan-cache
    - time trivy image --download-db-only --no-progress --cache-dir .trivycache/
    - trivy image --ignore-unfixed --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --cache-dir .trivycache/ $PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:test
  cache:
    paths:
      - .trivycache/
  only:
    - main

publish_staging:
  stage: publish
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  dependencies:
    - build
  script:
    - echo $STAGING_DOCKER_PASSWORD | docker login -u $STAGING_DOCKER_USERNAME --password-stdin $STAGING_DOCKER_REGISTRY
    - docker pull $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:test
    - docker tag $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:test $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker push $STAGING_DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker buildx build -t $STAGING_DOCKER_REGISTRY/$DOCKER_DOCS_IMAGE:latest -f docs/Dockerfile .
    - docker push $STAGING_DOCKER_REGISTRY/$DOCKER_DOCS_IMAGE:latest
  only:
    - dev

publish_production:
  stage: publish
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  dependencies:
    - build
  script:
    - echo $PRODUCTION_DOCKER_PASSWORD | docker login -u $PRODUCTION_DOCKER_USERNAME --password-stdin $PRODUCTION_DOCKER_REGISTRY
    - docker pull $PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:test
    - docker tag $PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:test $PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker push $PRODUCTION_DOCKER_REGISTRY/$DOCKER_IMAGE:latest
    - docker buildx build -t $PRODUCTION_DOCKER_REGISTRY/$DOCKER_DOCS_IMAGE:latest -f docs/Dockerfile .
    - docker push $PRODUCTION_DOCKER_REGISTRY/$DOCKER_DOCS_IMAGE:latest
  only:
    - main

deploy_staging:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  dependencies:
    - publish_staging
  before_script:
    - mkdir -p ~/.kube
    - echo "$STAGING_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_RESOURCE
    - kubectl rollout status $KUBERNETES_RESOURCE
  only:
    - dev

deploy_production:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  dependencies:
    - publish_production
  before_script:
    - mkdir -p ~/.kube
    - echo "$PRODUCTION_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - kubectl rollout restart $KUBERNETES_RESOURCE
    - kubectl rollout status $KUBERNETES_RESOURCE
  only:
    - main

deploy_wiki:
  stage: deploy
  trigger:
    project: $WIKI_PIPELINE_PROJECT
    branch: main
  only:
    - dev

validate_staging:
  stage: validate
  image:
    name: bitnami/kubectl:latest
    entrypoint: [ "" ]
  dependencies:
    - deploy_staging
  before_script:
    - mkdir -p ~/.kube
    - echo "$STAGING_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - |
      NEW_POD=$(kubectl get pods -l app=${KUBERNETES_APP} -o jsonpath='{.items[0].metadata.name}')
      kubectl logs $NEW_POD
  only:
    - dev
  when: manual

validate_production:
  stage: validate
  image:
    name: bitnami/kubectl:latest
    entrypoint: [ "" ]
  dependencies:
    - deploy_production
  before_script:
    - mkdir -p ~/.kube
    - echo "$PRODUCTION_KUBERNETES_CONFIGURATION" > ~/.kube/config
  script:
    - |
      NEW_POD=$(kubectl get pods -l app=${KUBERNETES_APP} -o jsonpath='{.items[0].metadata.name}')
      kubectl logs $NEW_POD
  only:
    - main
  when: manual

merge:
  stage: merge
  image: curlimages/curl:latest
  script:
    - |
      curl --request POST --header "PRIVATE-TOKEN: $DULNO_GITLAB_PRIVATE_TOKEN" \
      --data "source_branch=dev&target_branch=main&title=Production deployment" \
      --data "remove_source_branch=false&squash=true" \
      "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/merge_requests"
  only:
    - dev
  when: on_success